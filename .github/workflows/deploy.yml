# Compila la app, pasa las pruebas y publica el resultado en la rama gh-pages,
# que es la que sirve GitHub Pages (Settings → Pages → Branch: gh-pages, carpeta raíz).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main, claude/keen-mendel-fsuoz2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Subir dist a la rama gh-pages
        working-directory: dist
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
